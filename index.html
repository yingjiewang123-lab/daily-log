<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监理日志汇总 - 项目部内部共享</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white border-b border-gray-200 py-8 px-4 text-center">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900">监理日志汇总</h1>
        <p class="mt-2 text-gray-500 text-sm md:text-base">用于项目部内部共享每日监理工作记录</p>
    </header>

    <div class="max-w-3xl mx-auto px-4 mt-6">
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 flex items-start shadow-sm">
            <div class="flex-shrink-0 mt-0.5">
                <svg class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </div>
            <div class="ml-3">
                <h3 class="text-lg font-bold text-amber-800">通知公告</h3>
                <p class="text-lg text-amber-700 mt-1 leading-relaxed">
                    各位同事填写完监理日志后请务必在监理日志最下方签到表里签到。--2026.03.04
                </p>
            </div>
        </div>
    </div>

    <main class="max-w-3xl mx-auto py-6 px-4">
        <div class="bg-white shadow-sm border border-gray-200 rounded-lg overflow-hidden relative">
            <iframe 
                src="https://www.kdocs.cn/l/ch1muaGwiHrV" 
                class="w-full h-[600px] md:h-[80vh] border-none"
                allowfullscreen="true">
            </iframe>
        </div>
    </main>

    <footer class="max-w-3xl mx-auto py-10 px-4">
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-6">
            <h3 class="text-blue-800 text-sm font-semibold mb-1">使用说明：</h3>
            <p class="text-blue-700 text-xs leading-relaxed">
                1. 本页面由项目部统一维护，每日下班前更新。<br>
                2. 在上方表格中找到对应日期，点击链接即可跳转至监理日志进行编辑。<br>
                3. 如发现问题，请联系管理员：郗传杰。
            </p>
        </div>
        
        <p class="text-center text-gray-400 text-xs mt-8">© 华能泰安燃机项目部</p>
    </footer>

</html>
